# ===================================================================
# 🏆 比赛环境优化配置 - Competition Optimized
# ===================================================================
# 基于官方固定参数的优化配置
# 
# 关键发现：
# 1. 总流量：9,900 veh/h（固定）
# 2. CV渗透率：25%（官方配置），但我们可以选择控制更少
# 3. Episode时长：3600秒（固定）
# 4. 瓶颈点：J15、J17交叉口（汇入流量各1500 veh/h）
# 5. 预期车辆数：稳态约250-300辆在线
# ===================================================================

device: cuda:0
seed: 42

# =============================================================================
# 路径配置
# =============================================================================
paths:
  checkpoint_dir: checkpoints/competition
  log_dir: logs/competition
  tensorboard_dir: runs/competition

# =============================================================================
# 环境配置 - 完全匹配官方参数
# =============================================================================
environment:
  # SUMO配置
  sumo_config: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # ========== 官方固定参数（不要修改）==========
  max_vehicles: 600        # 在线车辆峰值
  inflow_rate: 9900        # 总流量 9,900 veh/h
  max_steps: 36000         # 3600秒 ÷ 0.1秒/步 = 36000步
  step_length: 0.1         # 时间步长0.1秒
  warmup_steps: 300        # 预热30秒
  
  # ========== 智能控制策略（核心优化点）==========
  icv_ratio: 0.10          # 🎯 只控制10%车辆（vs 官方25% CV）
                           # 理由：官方25%是CV占比，不是必须全控制
                           # 通过智能选择，10%足以达到最佳效果
  
  # ICV动态管理
  icv_reevaluate_interval: 100  # 每100步重新评估ICV组成
  icv_min_control_duration: 50   # 车辆至少控制50步后才能释放
  
  # 奖励配置
  rewards:
    speed_weight: 1.0
    efficiency_weight: 2.0
    safety_weight: 3.0
    intervention_cost_weight: 2.0  # 提高干预成本权重

# =============================================================================
# 模型配置 - 轻量高效
# =============================================================================
model:
  gnn:
    node_dim: 9               # 车辆状态：[s, d, vs, vd, lane, accel, in_bottleneck, ttc, speed_diff]
    hidden_dim: 64            # 隐藏维度（平衡性能与速度）
    output_dim: 64
    num_layers: 3             # 3层GNN
    dropout: 0.1
    top_k_ratio: 0.10         # 与icv_ratio保持一致

# =============================================================================
# 训练配置 - 快速收敛
# =============================================================================
training:
  # ========== Stage 1: 启发式引导（监督学习）==========
  stage1:
    num_episodes: 100         # 收集100 episodes数据
    epochs: 20                # 训练20轮
    batch_size: 64            # 批大小
    learning_rate: 0.001      # 学习率
    
    # 数据增强
    use_data_augmentation: true
    augmentation_factor: 2    # 每个样本增强2倍
    
  # ========== Stage 2: 强化学习微调 ==========
  stage2:
    num_episodes: 200         # PPO训练episodes
    learning_rate: 0.0001     # 更小的学习率
    gamma: 0.99               # 折扣因子
    max_grad_norm: 0.5        # 更严格的梯度裁剪

# =============================================================================
# OCR奖励配置 - 匹配官方评测
# =============================================================================
ocr_rewards:
  # ========== 官方评测公式参数 ==========
  k_penalty: 0.1             # 干预成本惩罚系数
  w_efficiency: 0.7          # 初赛效率权重70%
  w_stability: 0.3           # 稳定性权重30%
  
  # ========== 干预成本计算 ==========
  alpha: 1.0                 # 加速度指令成本
  beta: 5.0                  # 换道指令成本（5倍）
  
  # ========== 改进奖励设计 ==========
  use_improved_reward: true  # 启用改进的奖励函数
  ocr_reward_scale: 100.0    # OCR奖励缩放
  intervention_penalty_scale: 10.0  # 干预惩罚缩放

# =============================================================================
# 稀疏控制器配置 - 关键优化
# =============================================================================
sparse_controller:
  enabled: true
  controller_type: 'learned'
  
  # ========== 决策频率优化 ==========
  decision_interval: 10      # 每10步（1秒）决策一次
                             # 减少T_total：3600秒 → 360次决策
  
  # ========== Top-K选择策略 ==========
  top_k_ratio: 0.10          # 只控制10%车辆
  min_k: 5                   # 至少5辆（保证基本控制）
  max_k: 30                  # 最多30辆（防止过度控制）
  
  # ========== 启发式规则（Baseline/数据生成）==========
  bottleneck_threshold: 0.7
  speed_threshold_ratio: 0.6  # 速度低于60%限速才控制
  merge_zone_start: 0.4       # 汇流区从40%位置开始
  merge_zone_end: 0.9         # 到90%位置结束
  ttc_threshold: 5.0          # TTC<5秒才控制

# =============================================================================
# 神经网络ICV评分器 - 智能选择核心
# =============================================================================
neural_icv_scoring:
  enabled: true
  
  # ========== 网络架构 ==========
  node_dim: 9
  hidden_dim: 64
  num_layers: 3
  num_heads: 4
  dropout: 0.1
  
  # ========== 图构建参数 ==========
  distance_threshold: 100.0  # 只考虑100米内的交互
  max_neighbors: 8           # 每辆车最多8个邻居
  
  # ========== 预训练权重 ==========
  checkpoint_path: null      # Stage 1完成后填入

# =============================================================================
# 启发式选择器 - 瓶颈区域针对性优化
# =============================================================================
heuristic_selector:
  # ========== 基于路网分析的瓶颈定义 ==========
  # 主路：E1(0m) → E2 → E3 → E5 → E6 → E7 → E8 → E9 → E10 → E11 → E12 → E13
  # 关键瓶颈：
  #   - J5 (E23汇入): 1500 veh/h
  #   - J15 (E17汇入): 1500 veh/h ← 最严重
  #   - J17 (E19汇入): 1500 veh/h ← 最严重
  
  # 多个瓶颈区域（Frenet纵向坐标s）
  bottleneck_zones:
    # 区域1：E23汇入（J5附近）
    - name: "e23_merge"
      s_min: 200.0
      s_max: 500.0
      priority: 1.2           # 优先级权重
    
    # 区域2：E17汇入（J15附近）- 高优先级
    - name: "e17_merge"
      s_min: 1200.0
      s_max: 1600.0
      priority: 1.5           # 最高优先级
    
    # 区域3：E19汇入（J17附近）- 高优先级
    - name: "e19_merge"
      s_min: 1800.0
      s_max: 2200.0
      priority: 1.5           # 最高优先级
  
  # ========== IDM控制参数 ==========
  max_accel: 2.0
  max_decel: -4.5            # 更强的制动（匹配官方decel=4.5）
  safe_time_gap: 1.5
  desired_speed: 30.0        # 目标速度30 m/s（匹配官方maxSpeed）

# =============================================================================
# 评估配置
# =============================================================================
evaluation:
  num_episodes: 10           # 评估10个episodes
  save_trajectories: true    # 保存轨迹数据
  compute_detailed_metrics: true  # 计算详细指标
  
  # 评估指标
  metrics:
    - ocr                    # OD完成率
    - avg_speed              # 平均速度
    - speed_std              # 速度标准差
    - intervention_cost      # 干预成本
    - final_score            # 最终得分
    - bottleneck_throughput  # 瓶颈通行能力

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: INFO
  log_interval: 10           # 每10 episodes记录一次
  save_checkpoint_interval: 20  # 每20 episodes保存checkpoint
  tensorboard_log_interval: 1   # 每个episode记录到tensorboard

# =============================================================================
# 实验配置 - 多组对比实验
# =============================================================================
experiments:
  # 实验1：Baseline（25%控制）
  baseline_25pct:
    icv_ratio: 0.25
    top_k_ratio: 0.25
    decision_interval: 10
  
  # 实验2：优化方案（10%控制）
  optimized_10pct:
    icv_ratio: 0.10
    top_k_ratio: 0.10
    decision_interval: 10
  
  # 实验3：激进方案（5%控制）
  aggressive_5pct:
    icv_ratio: 0.05
    top_k_ratio: 0.05
    decision_interval: 10
  
  # 实验4：超激进（3%控制）
  ultra_aggressive_3pct:
    icv_ratio: 0.03
    top_k_ratio: 0.03
    decision_interval: 10
