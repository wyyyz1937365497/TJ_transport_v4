# MPC配置 - 修复lane_change问题

global:
  device: cuda
  seed: 42

environment:
  sumo_config: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg
  icv_ratio: 0.25
  max_steps: 3600
  use_gui: false

mpc:
  prediction_horizon: 10
  control_horizon: 5
  dt: 0.1

  # 状态权重
  state_weights:
    speed: 10.0
    position: 1.0
    acceleration: 0.1
    gap: 50.0

  # 控制权重 - ✅ 修复：大幅降低R_lane以允许换道
  control_weights:
    acceleration: 0.5
    lane_change: 0.001  # 从0.1降低到0.001（降低100倍）

  # 约束
  constraints:
    min_accel: -4.5
    max_accel: 2.0
    min_speed: 0.0
    max_speed: 30.0
    min_gap: 2.0
    desired_gap: 5.0

  # 瓶颈区域
  bottleneck_region:
    s_min: 1200.0
    s_max: 2200.0

  # 求解器
  solver:
    name: OSQP
    verbose: false
    max_iters: 1000
    tolerance: 0.0001

  # 增量优化
  incremental_optimization:
    enabled: true
    update_interval: 3
    warm_start: true

  controller_type: centralized

  # 车辆选择
  vehicle_selection:
    strategy: rule_based
    k_vehicles: 25  # 从50降低到25，减少控制车辆

# 数据收集配置
data_collection:
  num_episodes: 50
  num_workers: 4
  output_dir: data/demonstrations/mpc_fixed
  timeout: 400

# 训练配置
training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  validation_split: 0.2

# 评估配置
evaluation:
  num_episodes: 10
  eval_interval: 5
