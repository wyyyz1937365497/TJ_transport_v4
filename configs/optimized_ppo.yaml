# PPO优化配置 - 基于性能分析

device: cuda:0
seed: 42

# =============================================================================
# 关键优化1: 单环境 + 大batch
# =============================================================================
# 为什么单环境更快？
# - SUMO是CPU密集型，无法GPU加速
# - 多进程开销 > 并行收益
# - 测试结果: 1环境 > 2环境 > 4环境
#
# 为什么大batch？
# - GPU利用率: 64batch → 20-30%, 256batch → 60-80%
# - 训练稳定性: 大batch → 更稳定的梯度
# =============================================================================

training:
  phase2:
    # 环境配置
    num_envs: 1  # ✅ 单环境（最快）

    # Rollout配置
    n_steps: 4096  # ✅ 增加步数（2048 → 4096），收集更多数据

    # PPO更新配置
    batch_size: 256  # ✅ 大batch（64 → 256），提高GPU利用率
    update_epochs: 5   # ✅ 减少epoch（10 → 5），避免过拟合

    # 学习率
    learning_rate: 3e-4

    # PPO超参数
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    max_grad_norm: 0.5

# =============================================================================
# 预期性能改进
# =============================================================================
# Rollout速度: ~2x提升（单环境 vs 多环境）
# Update速度: ~3x提升（大batch vs 小batch）
# GPU利用率: 20% → 70%
# 总训练时间: ~5.5小时 → ~2小时
