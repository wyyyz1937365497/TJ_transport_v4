# TJ_transport_v4 - Windows环境高性能配置
# 适用于高性能PC配置（8+核CPU，16GB+ GPU内存）

# 基础设置
device: cuda  # cuda, cpu, auto
seed: 42
precision: bf16  # bf16, fp16, fp32

# 项目路径
paths:
  root_dir: .
  data_dir: data
  log_dir: logs
  checkpoint_dir: checkpoints
  result_dir: results

# SUMO环境配置
environment:
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.xml
  step_length: 0.1
  max_steps: 3600
  control_ratio: 0.25
  use_gui: false
  num_parallel_workers: 16  # 增加到16个SUMO并行实例

# 模型架构
model:
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  world_model:
    input_dim: 256
    hidden_dim: 128
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 16
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# 训练配置 - 完整4阶段训练（高性能优化）
training:
  # 阶段1: World Model预训练
  phase1:
    enabled: true
    num_episodes: 30  # 更多episodes
    epochs: 30
    batch_size: 256  # 更大batch size
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    data_collection_timeout: 300  # 更长超时
    num_parallel_workers: 8  # 更多并行工作进程
    use_mixed_precision: true  # 启用混合精度
    gradient_clip: 1.0
    warmup_epochs: 5
    phase1_model_path: "checkpoints/world_model_phase1.pth"

  # 阶段2: PPO训练（主要训练阶段）
  phase2:
    enabled: true
    num_envs: 16  # 关键：16个并行环境
    total_timesteps: 200000  # 更多训练步数
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 10
    batch_size: 256  # 增加批次大小
    n_steps: 2048  # rollout步数
    phase2_model_path: "checkpoints/ppo_phase2.pth"

  # 阶段3: 端到端微调
  phase3:
    enabled: true
    total_timesteps: 100000  # 更多步数
    learning_rate: 1.0e-5
    freeze_bn: true
    phase3_model_path: "checkpoints/e2e_phase3.pth"

  # 阶段4: 约束优化训练（拉格朗日乘子法）
  phase4:
    enabled: true
    total_timesteps: 100000  # 更多步数
    cost_limit: 0.1
    learning_rate: 1.0e-4
    final_model_path: "checkpoints/final_model.pth"

# 评估配置
evaluation:
  num_episodes: 5
  generate_xlsx: true

# WandB配置
wandb:
  enabled: false
  project: tj-transport
  entity: null
  run_name: null

# 日志配置
logging:
  log_every_n_steps: 20  # 减少日志频率以提高性能
  val_check_interval: 200
  save_top_k: 3
  profiler: null  # 关闭profiler以提高性能
