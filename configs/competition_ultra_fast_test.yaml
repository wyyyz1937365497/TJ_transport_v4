# 超快速测试配置 - 完整训练流程验证（5-10分钟）
# 策略：减少训练步数 + 增大batch_size + 增加并行度
# 用途：快速验证代码正确性、功能测试、CI/CD
# 时间：5-10分钟完整跑通所有阶段

# =============================================================================
# 基础设置
# =============================================================================
device: cuda  # cuda, cpu, auto
seed: 42
precision: bf16  # bf16, fp16, fp32

# =============================================================================
# 项目路径配置
# =============================================================================
paths:
  root_dir: .
  data_dir: data
  log_dir: logs/ultra_fast_test
  checkpoint_dir: checkpoints/ultra_fast_test
  result_dir: results/ultra_fast_test

# =============================================================================
# SUMO环境配置 - 优化并行
# =============================================================================
environment:
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.xml

  # ⚡ 适度缩短episode（保持足够的交互）
  step_length: 0.1
  max_steps: 600     # 仿真1分钟（从3600秒减少，仍保留足够交通流）

  control_ratio: 0.25
  use_gui: false

  # ⚡⚡ 大幅增加并行度（关键优化）
  num_parallel_workers: 8  # Phase 1数据收集：8个并行worker

# =============================================================================
# 模型架构 - 保持不变
# =============================================================================
model:
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  world_model:
    input_dim: 256
    hidden_dim: 128
    latent_dim: 64
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 32
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# =============================================================================
# 训练配置 - 平衡速度和质量
# =============================================================================
training:
  # ⚡ Phase 1: 快速数据收集
  phase1:
    enabled: true
    num_episodes: 3      # 只收集3个episodes
    epochs: 3            # 只训练3轮
    batch_size: 128      # ⚡ 中等batch（平衡速度和稳定性）
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    data_collection_timeout: 120
    num_parallel_workers: 8    # ⚡ 8个并行worker加速数据收集
    use_mixed_precision: true
    gradient_clip: 1.0
    warmup_epochs: 1
    phase1_model_path: "checkpoints/ultra_fast_test/world_model_phase1.pth"

  # ⚡⚡ Phase 2: 高吞吐量PPO训练
  phase2:
    enabled: true
    num_envs: 16        # ⚡⚡ 大幅增加并行环境（关键！）
    total_timesteps: 1000   # ⚡ 最少训练步数
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 3       # 减少更新轮数
    batch_size: 512        # ⚡⚡ 大batch提升GPU利用率
    n_steps: 62            # ⚡ 小rollout（更快更新，16*62=992，接近1000）
    max_grad_norm: 0.5
    phase2_model_path: "checkpoints/ultra_fast_test/ppo_phase2.pth"

  # ⚡ Phase 3: 快速端到端微调
  phase3:
    enabled: true
    total_timesteps: 500    # ⚡ 最少步数
    learning_rate: 1.0e-5
    freeze_bn: true
    phase3_model_path: "checkpoints/ultra_fast_test/e2e_phase3.pth"

  # ⚡ Phase 4: 快速约束优化
  phase4:
    enabled: true
    total_timesteps: 500    # ⚡ 最少步数
    cost_limit: 0.1
    learning_rate: 1.0e-4
    lagrangian_multiplier_init: 0.1
    final_model_path: "checkpoints/ultra_fast_test/final_model.pth"

# =============================================================================
# 评估配置 - 最小化
# =============================================================================
evaluation:
  num_episodes: 2      # 只评估2个episode
  generate_xlsx: false  # 不生成xlsx
  save_detailed_logs: false  # 不保存详细日志

# =============================================================================
# 可视化与监控
# =============================================================================
wandb:
  enabled: false  # 禁用wandb（节省时间）
  project: tj-transport-competition
  entity: null
  run_name: ultra_fast_test

logging:
  log_every_n_steps: 10
  val_check_interval: 100
  save_top_k: 1  # 只保存1个checkpoint
  profiler: null

# =============================================================================
# 比赛特定优化
# =============================================================================
competition:
  use_accurate_frenet: true
  enable_prediction_loop: true

  prediction_weights:
    risk_vehicle_boost: 1.3
    recommended_vehicle_boost: 1.2
    congestion_threshold: 0.7
    feature_enhancement_risk: 0.2
    feature_enhancement_congestion: 0.1

  bottleneck_optimization:
    enabled: true
    junctions: ["J14", "J15", "J17"]
    priority_multiplier: 1.5

  intervention_cost:
    alpha: 1.0
    beta: 5.0
    cost_penalty_factor: 0.01

# =============================================================================
# 训练优化技巧
# =============================================================================
training_tricks:
  use_lr_scheduler: false  # 禁用学习率调度（节省时间）

  use_gradient_clip: true
  max_grad_norm: 1.0

  use_experience_replay: false

  curriculum_learning:
    enabled: false
    stages: []

