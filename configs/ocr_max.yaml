# ==============================================================================
# OCR-MAX Architecture Configuration
# ==============================================================================
# 核心改进：
# 1. 移除SparseGate - 直接控制所有ICV
# 2. Multi-View Graph Attention - 3视角注意力机制
# 3. Bottleneck Reward Shaping - 即时奖励引导
# 4. 分阶段训练 - 模仿学习 + PPO微调
# 5. 架构简化 - 移除不必要的组件
# ==============================================================================

global:
  seed: 42
  device: cuda

# ==============================================================================
# Environment Configuration
# ==============================================================================
environment:
  # SUMO配置文件
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # 最大步数
  max_steps: 3600

  # ICV渗透率
  icv_ratio: 0.10

  # 是否使用GUI
  use_gui: false

# ==============================================================================
# Policy Network Configuration (SimplifiedICVPolicy)
# ==============================================================================
policy:
  # 观测维度 = max_vehicles * node_dim + 32 + 1 = 32 * 9 + 33 = 321
  obs_dim: 321

  # 车辆状态维度
  node_dim: 9

  # 隐藏层维度
  hidden_dim: 128

  # GNN层数
  num_layers: 3

  # 最大车辆数
  num_vehicles: 32

  # 是否使用SafetyShield（推理时启用，训练时禁用）
  use_safety_shield: false

# ==============================================================================
# Stage 0: 收集演示数据
# ==============================================================================
stage0_collect_demonstrations:
  # 是否启用
  enabled: true

  # 收集episode数量
  num_episodes: 50

  # 选择的车辆数量（Top-K）
  k_vehicles: 25

  # 并行worker数（默认1为串行，推荐4-8）
  num_workers: 4

  # 输出目录
  output_dir: data/demonstrations

# ==============================================================================
# Stage 1: 模仿学习
# ==============================================================================
stage1_imitation_learning:
  # 是否启用
  enabled: true

  # 训练epoch数
  num_epochs: 50

  # 批次大小
  batch_size: 32

  # 学习率
  lr: 1.0e-3

  # 梯度裁剪
  grad_clip: 1.0

  # 演示数据路径
  demo_data_path: data/demonstrations/demonstrations.pkl

# ==============================================================================
# Stage 2: PPO微调
# ==============================================================================
stage2_ppo_finetune:
  # 是否启用
  enabled: true

  # Stage 1检查点路径
  stage1_checkpoint: checkpoints/ocr_max/stage1_best.pth

  # PPO配置
  ppo:
    # 训练迭代数
    num_iterations: 100

    # 每次迭代的episode数
    num_episodes_per_iter: 10

    # 每个episode最大步数
    max_steps_per_episode: 3600

    # 学习率（微调使用更小的学习率）
    lr: 1.0e-4

    # PPO超参数
    gamma: 0.99                    # 折扣因子
    gae_lambda: 0.95               # GAE参数
    clip_epsilon: 0.2              # PPO裁剪参数
    entropy_coef: 0.01             # 熵系数
    value_coef: 0.5                # 价值损失系数

    # 训练配置
    num_minibatches: 4             # minibatch数量
    ppo_epochs: 10                 # 每次更新的PPO epoch数
    batch_size: 64                 # 批次大小

  # Bottleneck奖励配置
  bottleneck_rewards:
    # 是否启用
    enabled: true

    # 瓶颈区域定义（米）
    bottleneck_s_min: 1200.0       # E17, E19汇入区域起点
    bottleneck_s_max: 2200.0       # 瓶颈区域终点

    # 奖励权重
    w_throughput: 0.5              # 吞吐量奖励权重
    w_queue: 0.3                   # 排队奖励权重
    w_conflict: 0.2                # 冲突避免奖励权重

    # 阈值参数
    ttc_threshold: 3.0             # TTC阈值（秒）
    min_speed: 5.0                 # 最小速度（m/s）

# ==============================================================================
# Multi-View Graph Attention Configuration
# ==============================================================================
multi_view_attention:
  # 注意力头数
  num_heads: 4

  # Dropout比例
  dropout: 0.1

  # 空间邻近性阈值（归一化距离）
  spatial_sigma: 0.15             # 150米

  # 交互半径
  interaction_radius: 0.15

  # TTC阈值
  ttc_threshold: 3.0

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  # 日志目录
  log_dir: logs/ocr_max

  # TensorBoard
  use_tensorboard: true

  # 日志频率
  log_interval: 10

# ==============================================================================
# Checkpoint Configuration
# ==============================================================================
checkpoints:
  # 检查点目录
  dir: checkpoints/ocr_max

  # 保存频率
  save_interval: 10

  # 保留最近N个检查点
  keep_last_n: 5

# ==============================================================================
# Heuristic Selector (用于Stage 0)
# ==============================================================================
heuristic_selector:
  # 瓶颈区域定义
  bottleneck_s_min: 1200.0
  bottleneck_s_max: 2200.0

  # 关键汇入点
  key_merge_points:
    - {s: 1400.0, weight: 1.5, name: 'E17/J15'}
    - {s: 1800.0, weight: 1.5, name: 'E19/J17'}
    - {s: 1000.0, weight: 1.2, name: 'E23/J5'}

  # 评分权重
  weights:
    bottleneck: 0.40
    speed: 0.25
    lane: 0.15
    distance: 0.15
    ttc: 0.05

  # 车辆参数
  desired_speed: 30.0
  max_accel: 2.0
  max_decel: -4.5
  safe_time_gap: 1.5
  speed_threshold_ratio: 0.7

# ==============================================================================
# Sparse Controller (用于TTC计算)
# ==============================================================================
sparse_controller:
  # TTC阈值（秒）
  ttc_threshold: 3.0

  # 安全距离
  safe_distance: 5.0

  # 紧急制动减速度
  emergency_decel: -4.5

# ==============================================================================
# Training Configuration
# ==============================================================================
training:
  # 训练阶段顺序
  stages: ['stage0_collect_demonstrations', 'stage1_imitation_learning', 'stage2_ppo_finetune']

  # 是否跳过已完成的阶段
  skip_completed: true

  # 验证频率
  val_interval: 5

  # 早停配置
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.01

# ==============================================================================
# Evaluation Configuration
# ==============================================================================
evaluation:
  # 评估episode数
  num_episodes: 20

  # 是否使用GUI
  use_gui: false

  # 是否保存录像
  save_recording: false

  # 评估指标
  metrics:
    - ocr                    # OD完成率
    - mean_return            # 平均回报
    - episode_length         # Episode长度
    - throughput             # 吞吐量
    - avg_speed              # 平均速度
    - conflict_rate          # 冲突率

# ==============================================================================
# Misc Configuration
# ==============================================================================
misc:
  # 随机种子
  seed: 42

  # 线程数
  num_workers: 4

  # PIN内存（用于GPU训练）
  pin_memory: true

  # 混合精度训练
  use_amp: false

  # 检测点
  detect_anomaly: false
