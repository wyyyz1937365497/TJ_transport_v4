# TJ_transport_v4 - Windows环境基础配置
# 适用于标准PC配置（4-8核CPU，8-16GB GPU内存）

# 基础设置
device: cuda  # cuda, cpu, auto
seed: 42
precision: bf16  # bf16, fp16, fp32

# 项目路径
paths:
  root_dir: .
  data_dir: data
  log_dir: logs
  checkpoint_dir: checkpoints
  result_dir: results

# SUMO环境配置
environment:
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.xml
  step_length: 0.1
  max_steps: 3600
  control_ratio: 0.25
  use_gui: false
  num_parallel_workers: 4  # SUMO并行实例数

# 模型架构
model:
  # 图神经网络
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  # 世界模型
  world_model:
    input_dim: 256
    hidden_dim: 128
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  # 控制器
  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 16
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  # 安全屏障
  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  # 图构建
  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# 训练配置
training:
  # 阶段2: PPO训练（主要训练阶段）
  phase2:
    enabled: true
    num_envs: 4  # 并行环境数量（标准配置）
    total_timesteps: 100000  # 总训练步数
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 10
    batch_size: 128  # PPO批次大小
    n_steps: 2048  # 每次rollout的步数

# 评估配置
evaluation:
  num_episodes: 5
  generate_xlsx: true

# WandB配置
wandb:
  enabled: false
  project: tj-transport
  entity: null
  run_name: null

# 日志配置
logging:
  log_every_n_steps: 10
  val_check_interval: 100
  save_top_k: 3
  profiler: null  # simple, advanced, null
