# ==============================================================================
# 高渗透率测试配置（验证假设：更多ICV → 更高OCR）
# ==============================================================================
# 核心假设：
# - 初赛不惩罚干预成本（P_int = 1）
# - 控制更多车辆 → 更好的交通流 → 更高的OCR
# ==============================================================================

global:
  seed: 42
  device: cuda

# ==============================================================================
# Environment Configuration
# ==============================================================================
environment:
  # SUMO配置文件
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # 最大步数
  max_steps: 3600

  # ICV渗透率（修改为30%，测试假设）
  icv_ratio: 0.30  # 10% → 30%（约75辆车）

  # 是否使用GUI
  use_gui: false

# ==============================================================================
# Policy Network Configuration (SimplifiedICVPolicy)
# ==============================================================================
policy:
  # 观测维度 = max_vehicles * node_dim + max_vehicles + 1
  # 30%渗透率 → ~75辆车 → obs_dim = 75 * 9 + 75 + 1 = 751
  obs_dim: 751

  # 车辆状态维度
  node_dim: 9

  # 隐藏层维度
  hidden_dim: 128

  # GNN层数
  num_layers: 3

  # 最大车辆数（扩大以支持30%渗透率）
  num_vehicles: 75  # 32 → 75

  # 是否使用SafetyShield（推理时启用，训练时禁用）
  use_safety_shield: false

# ==============================================================================
# Stage 0: 收集演示数据
# ==============================================================================
stage0_collect_demonstrations:
  # 是否启用
  enabled: true

  # 收集episode数量
  num_episodes: 50

  # 选择的车辆数量（Top-K）
  k_vehicles: 75  # 25 → 75（匹配30%渗透率）

  # 并行worker数
  num_workers: 4

  # 输出目录
  output_dir: data/demonstrations_high_penetration

# ==============================================================================
# Stage 1: 模仿学习
# ==============================================================================
stage1_imitation_learning:
  # 是否启用
  enabled: true

  # 训练epoch数
  num_epochs: 50

  # 批次大小
  batch_size: 32

  # 学习率
  lr: 1.0e-3

  # 梯度裁剪
  grad_clip: 1.0

  # 演示数据路径
  demo_data_path: data/demonstrations_high_penetration/demonstrations.pkl

# ==============================================================================
# Stage 2: PPO微调
# ==============================================================================
stage2_ppo_finetune:
  # 是否启用
  enabled: true

  # Stage 1检查点路径
  stage1_checkpoint: checkpoints/ocr_max_high_penetration/stage1_best.pth

  # PPO配置
  ppo:
    # 训练迭代数
    num_iterations: 100

    # 每次迭代的episode数
    num_episodes_per_iter: 5

    # 每个episode最大步数
    max_steps_per_episode: 1800

    # 学习率（微调使用更小的学习率）
    lr: 1.0e-4

    # PPO超参数
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_coef: 0.5

    # 训练配置
    num_minibatches: 8
    ppo_epochs: 15
    batch_size: 128

  # Bottleneck奖励配置
  bottleneck_rewards:
    enabled: true
    bottleneck_s_min: 1200.0
    bottleneck_s_max: 2200.0
    w_throughput: 0.5
    w_queue: 0.3
    w_conflict: 0.2
    ttc_threshold: 3.0
    min_speed: 5.0

# ==============================================================================
# Multi-View Graph Attention Configuration
# ==============================================================================
multi_view_attention:
  num_heads: 4
  dropout: 0.1
  spatial_sigma: 0.15
  interaction_radius: 0.15
  ttc_threshold: 3.0

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  # 日志目录（高渗透率单独目录）
  log_dir: logs/ocr_max_high_penetration

  use_tensorboard: true
  log_interval: 10

# ==============================================================================
# Checkpoint Configuration
# ==============================================================================
checkpoints:
  # 检查点目录（高渗透率单独目录）
  dir: checkpoints/ocr_max_high_penetration

  save_interval: 10
  keep_last_n: 5

# ==============================================================================
# Heuristic Selector (用于Stage 0)
# ==============================================================================
heuristic_selector:
  bottleneck_s_min: 1200.0
  bottleneck_s_max: 2200.0

  key_merge_points:
    - {s: 1400.0, weight: 1.5, name: 'E17/J15'}
    - {s: 1800.0, weight: 1.5, name: 'E19/J17'}
    - {s: 1000.0, weight: 1.2, name: 'E23/J5'}

  weights:
    bottleneck: 0.40
    speed: 0.25
    lane: 0.15
    distance: 0.15
    ttc: 0.05

  desired_speed: 30.0
  max_accel: 2.0
  max_decel: -4.5
  safe_time_gap: 1.5
  speed_threshold_ratio: 0.7

# ==============================================================================
# Sparse Controller (用于TTC计算)
# ==============================================================================
sparse_controller:
  ttc_threshold: 3.0
  safe_distance: 5.0
  emergency_decel: -4.5

# ==============================================================================
# Training Configuration
# ==============================================================================
training:
  stages: ['stage0_collect_demonstrations', 'stage1_imitation_learning', 'stage2_ppo_finetune']
  skip_completed: true
  val_interval: 5

  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.01

# ==============================================================================
# Evaluation Configuration
# ==============================================================================
evaluation:
  num_episodes: 20
  use_gui: false
  save_recording: false

  metrics:
    - ocr
    - mean_return
    - episode_length
    - throughput
    - avg_speed
    - conflict_rate

# ==============================================================================
# Misc Configuration
# ==============================================================================
misc:
  seed: 42
  num_workers: 4
  pin_memory: true
  use_amp: false
  detect_anomaly: false
