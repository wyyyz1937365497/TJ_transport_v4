# 增强训练配置文件 - 初赛阶段（含所有增强功能）
# 配置文件包含：课程学习、优先经验回放、失败案例库

# =============================================================================
# 基础配置
# =============================================================================
device: cuda:0  # 强制使用单个GPU（cuda:0），禁用双GPU模式
seed: 42

# 路径配置
paths:
  checkpoint_dir: checkpoints/competition
  log_dir: logs
  tensorboard_dir: runs

# =============================================================================
# 比赛专用配置
# =============================================================================
competition:
  # ✅ 奖励权重配置（用于CompetitionSumoEnv）
  reward_weights:
    speed_norm: 1.0 / 30.0          # 速度归一化因子（30m/s为最大速度）
    throughput: 10.0                # 吞吐量权重
    efficiency_weights: [5.0, 3.0, 2.0]  # 效率权重：[speed, throughput, completion]
    stability_weight: 0.5           # 稳定性权重（速度方差惩罚）
    congestion_penalty_weight: 2.0  # 拥堵惩罚权重
    stopped_penalty_weight: 1.0     # 停车惩罚权重

# =============================================================================
# 环境配置
# =============================================================================
environment:
  # SUMO配置
  # 使用优化后的训练配置（sumo_train.sumocfg）
  sumo_config: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.rou.xml

  # ⚠️ 重要：SUMO仿真参数（由代码自动添加，确保与官方配置文件sumo.sumocfg一致）
  # 这些参数在gpu_sumo_env_optimized.py中设置，保证训练环境与评测环境完全一致
  # - collision.check-junctions: true   (启用路口碰撞检测，官方配置)
  # - collision.action: warn             (碰撞时警告，官方配置)
  # - collision.stoptime: 5              (碰撞停止时间5秒，官方配置)
  # - collision.mingap-factor: 0         (严格碰撞检测，官方配置)
  # - time-to-teleport: 600              (teleport等待时间600秒，官方配置)
  # - ignore-route-errors: true          (忽略路由错误，官方配置)

  # 基础参数（✅ 2024-01-19 更新：适配MAX_VEHICLES=512）
  # 注意：这些是默认值，会被课程学习配置覆盖
  max_vehicles: 600       # ✅ 赛题场景的实际车辆数（400-600辆范围）
  inflow_rate: 9900       # ✅ 赛题实际流量（正向2900+反向1000+支路6000）
  icv_ratio: 0.25         # ✅ 智能车渗透率（25%，符合赛题要求）
  max_steps: 1800         # 缩短episode长度（3600 → 1800），加快训练
  warmup_steps: 150       # 减少预热时间（300 → 150）

  # 奖励配置
  rewards:
    speed_weight: 1.0
    efficiency_weight: 2.0
    safety_weight: 3.0
    intervention_cost_weight: 1.5

  # 扰动级别（0-1）
  disturbance_level: 0.0

# =============================================================================
# 模型配置 - v4.0架构
# =============================================================================
model:
  # GNN配置（✅ 方案A-阶段1优化：2024-01-19）
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 128        # ✅ 64 → 128 (2倍容量)
    output_dim: 256
    num_layers: 4          # ✅ 3 → 4 (增加1层)
    heads: 8               # ✅ 4 → 8 (2倍注意力头)
    dropout: 0.1

  # 世界模型配置（✅ 方案A-阶段1优化：2024-01-19）
  world_model:
    hidden_dim: 128
    latent_dim: 128        # ✅ 64 → 128 (2倍latent space)
    future_steps: 10       # ✅ 5 → 10 (预测更远未来)
    num_layers: 3          # ✅ 2 → 3 (增加1层)
    dropout: 0.1

  # 控制器配置（✅ 方案A-阶段1优化：2024-01-19）
  controller:
    global_dim: 32
    hidden_dim: 256        # ✅ 128 → 256 (2倍容量)
    action_dim: 2
    top_k: 10              # ✅ 5 → 10 (控制更多车辆)
    dropout: 0.2

  # 图构建配置
  graph:
    interaction_radius: 100.0  # 米
    max_neighbors: 8

  # 历史统计维度
  history_dim: 32

# =============================================================================
# 训练配置（三阶段）
# =============================================================================
training:
  # ========== 课程学习配置 ==========
  curriculum:
    enabled: true  # 启用课程学习（从简单到复杂逐步学习）
    auto_advance: true  # 自动晋级
    min_episodes_per_level: 10  # 测试模式：每个级别只需10个episodes（约12.6k步）
    min_reward_threshold: -1000  # 测试模式：降低奖励阈值，更容易晋级

    # ========== 课程级别配置（✅ 2024-01-19 更新：适配MAX_VEHICLES=512）==========
    # 所有训练阶段（Phase 1和Phase 2）使用统一的课程配置
    # 设计理念：
    # - max_vehicles: SUMO仿真中的实际车辆数（≤512）
    # - inflow_rate: 流量输入（veh/h），逐渐增加到赛题场景的9900 veh/h
    # - icv_ratio: ICV渗透率，赛题要求25%
    # - episodes: Phase 1数据收集的episodes数（每个级别）
    # - total_timesteps: Phase 2训练的步数（每个级别）
    levels:
      - level: 1
        name: "基础场景"
        description: "低流量、高渗透率、无扰动"
        max_vehicles: 50        # ✅ 从10提升到50
        inflow_rate: 1200       # ✅ 从800提升到1200
        icv_ratio: 0.30         # 30% ICV → 15辆可控
        disturbance_level: 0.0
        episodes: 100            # Phase 1数据收集episodes
        total_timesteps: 409600  # Phase 2训练步数（100个updates）
        success_threshold: 0.7
        min_reward: -100

      - level: 2
        name: "中等流量"
        description: "中等流量、适中渗透率、弱扰动"
        max_vehicles: 150       # ✅ 从15提升到150
        inflow_rate: 3000       # ✅ 从1200提升到3000
        icv_ratio: 0.25         # 25% ICV → 38辆可控
        disturbance_level: 0.2
        episodes: 150
        total_timesteps: 409600  # 100个updates
        success_threshold: 0.6
        min_reward: -200

      - level: 3
        name: "高流量场景"
        description: "高流量、标准渗透率、中等扰动"
        max_vehicles: 300       # ✅ 从20提升到300
        inflow_rate: 6000       # ✅ 从1800提升到6000
        icv_ratio: 0.25         # 25% ICV → 75辆可控
        disturbance_level: 0.4
        episodes: 200
        total_timesteps: 614400  # 150个updates
        success_threshold: 0.5
        min_reward: -300

      - level: 4
        name: "极端场景"
        description: "极高流量、低渗透率、强扰动"
        max_vehicles: 450       # ✅ 从32提升到450
        inflow_rate: 8000       # ✅ 从2400提升到8000
        icv_ratio: 0.20         # 20% ICV → 90辆可控（降低渗透率，增加难度）
        disturbance_level: 0.7
        episodes: 250
        total_timesteps: 819200  # 200个updates
        success_threshold: 0.4
        min_reward: -400

      - level: 5
        name: "赛题场景"
        description: "真实比赛条件、突发扰动"
        max_vehicles: 600       # ✅ 从32提升到600（达到赛题实际的400-600辆范围）
        inflow_rate: 9900       # ✅ 从2000提升到9900（赛题实际流量）
        icv_ratio: 0.25         # 25% ICV → 150辆可控（赛题要求）
        disturbance_level: 0.5
        episodes: 300
        total_timesteps: 819200  # 200个updates
        success_threshold: 0.5
        min_reward: -350

  # ========== 优先经验回放配置 ==========
  prioritized_replay:
    enabled: true  # 启用优先经验回放
    capacity: 100000  # 缓冲区容量
    alpha: 0.6  # 优先级指数（0=均匀，1=完全按优先级）
    beta_start: 0.4  # 重要性采样初始值
    beta_frames: 100000  # beta增长到1的帧数

  # ========== 失败案例库配置 ==========
  failure_bank:
    enabled: true  # 启用失败案例库
    max_size: 1000  # 最大存储案例数
    auto_detect: true  # 自动检测失败
    failure_sampling_ratio: 0.3  # 训练时失败案例占比（30%）

  # ========== Phase 1: 世界模型预训练 ==========
  phase1:
    num_episodes: 50  # 数据收集episodes
    epochs: 30  # 训练轮数
    batch_size: 256
    learning_rate: 0.0001  # 1e-4
    num_parallel_workers: 16
    use_cache: true  # 使用数据缓存
    use_curriculum: true  # 启用课程学习（从Level 1逐步晋级到Level 5）

  # ========== Phase 2: 带安全屏障的PPO训练 ==========
  phase2:
    # ✅ 总训练步数（2024-01-19 更新）
    # Level 1: 409,600步 (100个updates) - 50辆，基础场景
    # Level 2: 409,600步 (100个updates) - 150辆，中等流量
    # Level 3: 614,400步 (150个updates) - 300辆，高流量场景
    # Level 4: 819,200步 (200个updates) - 450辆，极端场景
    # Level 5: 819,200步 (200个updates) - 600辆，赛题场景
    # 总计：3,072,000步（约3.07M步）
    total_timesteps: 3072000

    # ⚡ 性能优化配置（⭐ 性能优化版 - 2024更新）
    num_envs: 4  # ⭐ 增加到4个并行环境（原来是1）
    n_steps: 1024  # ⭐ 减少到1024步（原来是4096），保持总步数不变
    batch_size: 512  # ⭐ 增加batch size（原来是256）
    update_epochs: 10  # ⭐ 增加epoch（原来是5），提高样本利用率

    # 学习率
    learning_rate: 0.0001  # ⭐ 降低到1e-4（稳定训练，因为修改了动作范围）

    # PPO超参数
    gamma: 0.99  # 折扣因子
    gae_lambda: 0.95  # GAE参数
    clip_range: 0.2  # ⭐ PPO裁剪参数（与代码中的clip_epsilon一致）
    entropy_coef: 0.01  # ✅ 降低熵系数（0.1→0.01，提高确定性）
    value_loss_coef: 0.5  # 价值损失系数
    max_grad_norm: 0.5  # 梯度裁剪

    # KL散度控制
    target_kl: 0.01  # ⭐ KL散度目标值（用于early stop）

    # 增强功能集成
    use_curriculum: true  # 启用课程学习（确保5个级别都能学到，Level 5充分学习）
    use_per: true  # 使用优先经验回放
    use_failure_bank: true  # 使用失败案例库

  # ========== Phase 3: 拉格朗日约束优化 ==========
  phase3:
    total_timesteps: 100000
    num_envs: 4
    learning_rate: 0.0001  # 1e-4
    n_steps: 2048
    batch_size: 64
    update_epochs: 10
    cost_limit: 0.1  # 成本约束（干预率不超过10%）
    use_curriculum: true  # 启用课程学习

  # ========== Phase 4: 拉格朗日乘子配置 ==========
  phase4:
    lagrangian_multiplier_init: 0.1  # 初始拉格朗日乘子
    lagrangian_lr: 0.01  # λ学习率
    adaptive_penalty: true  # 自适应惩罚

# =============================================================================
# 评估配置
# =============================================================================
evaluation:
  eval_freq: 10000  # 每10000步评估一次
  n_eval_episodes: 10  # 评估episodes数

  # 评估指标
  metrics:
    - avg_speed  # 平均速度
    - throughput  # 通过量
    - intervention_rate  # 干预率
    - safety_score  # 安全评分
    - total_reward  # 总奖励

# =============================================================================
# 日志配置
# =============================================================================
logging:
  tensorboard: true  # 启用TensorBoard
  wandb: false  # 启用Weights & Biases
  log_interval: 500  # 减少日志频率（100 → 500），降低I/O开销

  # 要记录的指标
  metrics:
    - episode_reward
    - episode_length
    - avg_speed
    - intervention_rate
    - curriculum_level
    - replay_buffer_size
    - failure_cases_count

# =============================================================================
# 高级配置（可选）
# =============================================================================
advanced:
  # 混合精度训练
  mixed_precision: true  # 启用以加速训练并减少显存占用

  # 梯度检查点（节省显存）
  gradient_checkpointing: false

  # 模型并行
  model_parallel: false

  # 自动混合精度（AMP）
  amp: true  # 启用PyTorch AMP

# =============================================================================
# 智能ICV管理配置（Top-K机制）⭐ v4.0新增
# =============================================================================
smart_icv:
  enabled: false  # ⭐ 是否启用智能ICV管理（默认关闭，待验证后启用）

  # Top-K参数（按需干预）
  default_top_k: 5      # 默认控制5辆（平峰期，远小于25%）
  elevated_top_k: 10    # 升级控制10辆（检测到拥堵风险）
  emergency_top_k: 15   # 紧急控制15辆（检测到高危事件）

  # 约束条件
  intervention_threshold: 0.25  # ICV渗透率上限（赛题要求≤30%，我们设置更保守的25%）

  # 决策机制
  decision_interval: 10  # 默认决策周期（10步）
  event_triggered: true  # 启用事件触发（检测到高危立即介入）

  # 安全阈值
  ttc_threshold: 2.0    # TTC高危阈值（秒）- 小于2秒触发紧急制动
  thw_threshold: 1.5    # THW高危阈值（秒）- 小于1.5秒触发警告

  # 两级安全屏障
  safety_barrier_level1: true   # Level 1: 规则卫士（每步检查动作范围）
  safety_barrier_level2: true   # Level 2: 紧急避险（TTC<2.0s强制制动）

  # 影响力评分权重
  influence_weights:
    risk_weight: 0.4       # 风险指标（TTC/THW）权重 - 最高优先级
    location_weight: 0.3   # 位置权重（瓶颈区域）权重
    speed_weight: 0.15     # 速度权重（异常车辆）权重
    lane_weight: 0.10      # 车道权重（关键车道）权重
    dynamic_weight: 0.05   # 动态权重（急加减速）权重
