# 神经网络ICV评分配置

# =============================================================================
# 神经网络ICV评分配置
# =============================================================================
neural_icv_scoring:
  # 是否启用神经网络评分
  enabled: true  # 设为false则回退到规则评分

  # 混合评分权重
  rule_weight: 0.3    # 规则评分权重（可解释性）
  neural_weight: 0.7  # 神经网络评分权重（学习能力）

  # 神经网络架构配置
  node_dim: 9          # 输入特征维度
  hidden_dim: 64       # GNN隐藏层维度
  num_layers: 3        # GNN层数
  num_heads: 4         # 注意力头数
  dropout: 0.1         # Dropout比率

  # 图构建配置
  graph_builder:
    distance_threshold: 100.0  # 邻居距离阈值（米）
    max_neighbors: 8            # 最大邻居数

  # 预训练权重路径（可选）
  # 如果为None，使用随机初始化（会先进行预训练）
  checkpoint_path: null  # 例如: checkpoints/neural_scorer.pth

  # 训练配置
  training:
    # 预训练阶段（监督学习）
    pretrain:
      enabled: true
      epochs: 10
      batch_size: 32
      learning_rate: 0.001
      # 数据收集episodes
      num_episodes: 50

    # 微调阶段（强化学习）
    finetune:
      enabled: false  # 初赛可选，复赛建议启用
      total_steps: 50000
      learning_rate: 0.0001

# =============================================================================
# 继承基础配置
# =============================================================================
# 提示：使用此配置时，需要同时加载phase1_lite.yaml的基础配置
