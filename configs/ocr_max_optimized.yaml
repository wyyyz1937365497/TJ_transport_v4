# ==============================================================================
# OCR-MAX 优化配置（v6.0 - 修复版）
# ==============================================================================
# 核心改进：
# 1. 降低Bottleneck奖励权重，减少对即时奖励的过度依赖
# 2. 增加训练iterations和降低学习率，提高训练稳定性
# 3. 调整PPO超参数，减少策略波动
# 4. 启用Early Stopping防止过拟合
# ==============================================================================

global:
  seed: 42
  device: cuda

# ==============================================================================
# Environment Configuration
# ==============================================================================
environment:
  # SUMO配置文件
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # 最大步数
  max_steps: 3600

  # ICV渗透率（保持10%，先修复训练问题）
  icv_ratio: 0.10

  # 是否使用GUI
  use_gui: false

# ==============================================================================
# Policy Network Configuration (SimplifiedICVPolicy)
# ==============================================================================
policy:
  # 观测维度 = max_vehicles * node_dim + 32 + 1 = 32 * 9 + 33 = 321
  obs_dim: 321

  # 车辆状态维度
  node_dim: 9

  # 隐藏层维度
  hidden_dim: 128

  # GNN层数
  num_layers: 3

  # 最大车辆数
  num_vehicles: 32

  # 是否使用SafetyShield（推理时启用，训练时禁用）
  use_safety_shield: false

# ==============================================================================
# Stage 0: 收集演示数据
# ==============================================================================
stage0_collect_demonstrations:
  # 是否启用
  enabled: false  # 跳过Stage 0（已有数据）

  # 收集episode数量
  num_episodes: 50

  # 选择的车辆数量（Top-K）
  k_vehicles: 25

  # 并行worker数
  num_workers: 4

  # 输出目录
  output_dir: data/demonstrations

# ==============================================================================
# Stage 1: 模仿学习
# ==============================================================================
stage1_imitation_learning:
  # 是否启用
  enabled: false  # 跳过Stage 1（已有checkpoint）

  # 训练epoch数
  num_epochs: 50

  # 批次大小
  batch_size: 32

  # 学习率
  lr: 1.0e-3

  # 梯度裁剪
  grad_clip: 1.0

  # 演示数据路径
  demo_data_path: data/demonstrations/demonstrations.pkl

# ==============================================================================
# Stage 2: PPO微调（优化版）
# ==============================================================================
stage2_ppo_finetune:
  # 是否启用
  enabled: true

  # Stage 1检查点路径
  stage1_checkpoint: checkpoints/ocr_max/stage1_best.pth

  # PPO配置（优化版）
  ppo:
    # ========== 训练迭代数 ==========
    # 修改：100 → 150（增加训练轮数）
    num_iterations: 150

    # ========== Episode配置 ==========
    # 保持原设置（已经优化过）
    num_episodes_per_iter: 5
    max_steps_per_episode: 1800

    # ========== 学习率（关键修改）==========
    # 修改：1e-4 → 5e-5（降低学习率，提高稳定性）
    lr: 5.0e-5

    # ========== PPO超参数（微调）==========
    gamma: 0.99                    # 折扣因子（保持）
    gae_lambda: 0.95               # GAE参数（保持）
    clip_epsilon: 0.2              # PPO裁剪参数（保持）

    # ========== Entropy系数（关键修改）==========
    # 修改：0.01 → 0.005（降低熵系数，鼓励更确定的策略）
    # 问题：当前Entropy从14上升到19，说明策略太随机
    entropy_coef: 0.005

    # ========== Value系数（微调）==========
    value_coef: 0.5                # 价值损失系数（保持）

    # ========== 训练配置（保持）==========
    num_minibatches: 8
    ppo_epochs: 15
    batch_size: 128

  # ========== Bottleneck奖励配置（关键修改）==========
  bottleneck_rewards:
    enabled: true

    # 瓶颈区域定义（米）
    bottleneck_s_min: 1200.0
    bottleneck_s_max: 2200.0

    # ========== 奖励权重（大幅降低）==========
    # 原配置：throughput=0.5, queue=0.3, conflict=0.2
    # 问题：即时奖励权重太大，模型过度优化局部指标，忽略OCR目标
    # 修改：throughput=0.2, queue=0.1, conflict=0.1（总权重从1.0降到0.4）
    w_throughput: 0.2              # 0.5 → 0.2
    w_queue: 0.1                   # 0.3 → 0.1
    w_conflict: 0.1                # 0.2 → 0.1

    # 阈值参数
    ttc_threshold: 3.0
    min_speed: 5.0

# ==============================================================================
# Multi-View Graph Attention Configuration
# ==============================================================================
multi_view_attention:
  # 注意力头数
  num_heads: 4

  # Dropout比例
  dropout: 0.1

  # 空间邻近性阈值
  spatial_sigma: 0.15

  # 交互半径
  interaction_radius: 0.15

  # TTC阈值
  ttc_threshold: 3.0

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  # 日志目录
  log_dir: logs/ocr_max_v6

  # TensorBoard
  use_tensorboard: true

  # 日志频率
  log_interval: 10

# ==============================================================================
# Checkpoint Configuration
# ==============================================================================
checkpoints:
  # 检查点目录
  dir: checkpoints/ocr_max_v6

  # 保存频率
  save_interval: 10

  # 保留最近N个检查点
  keep_last_n: 5

# ==============================================================================
# Heuristic Selector (用于Stage 0)
# ==============================================================================
heuristic_selector:
  # 瓶颈区域定义
  bottleneck_s_min: 1200.0
  bottleneck_s_max: 2200.0

  # 关键汇入点
  key_merge_points:
    - {s: 1400.0, weight: 1.5, name: 'E17/J15'}
    - {s: 1800.0, weight: 1.5, name: 'E19/J17'}
    - {s: 1000.0, weight: 1.2, name: 'E23/J5'}

  # 评分权重
  weights:
    bottleneck: 0.40
    speed: 0.25
    lane: 0.15
    distance: 0.15
    ttc: 0.05

  # 车辆参数
  desired_speed: 30.0
  max_accel: 2.0
  max_decel: -4.5
  safe_time_gap: 1.5
  speed_threshold_ratio: 0.7

# ==============================================================================
# Sparse Controller (用于TTC计算)
# ==============================================================================
sparse_controller:
  # TTC阈值（秒）
  ttc_threshold: 3.0

  # 安全距离
  safe_distance: 5.0

  # 紧急制动减速度
  emergency_decel: -4.5

# ==============================================================================
# Training Configuration
# ==============================================================================
training:
  # 训练阶段顺序
  stages: ['stage2_ppo_finetune']  # 跳过Stage 0和1

  # 是否跳过已完成的阶段
  skip_completed: true

  # 验证频率
  val_interval: 5

  # ========== Early Stopping配置（关键新增）==========
  early_stopping:
    enabled: true
    patience: 15                # 10 → 15（更宽容）
    min_delta: 0.005           # 0.01 → 0.005（更敏感）
    monitor: 'ocr'             # 监控OCR指标
    mode: 'max'                # OCR越大越好

# ==============================================================================
# Evaluation Configuration
# ==============================================================================
evaluation:
  # 评估episode数
  num_episodes: 20

  # 是否使用GUI
  use_gui: false

  # 是否保存录像
  save_recording: false

  # 评估指标
  metrics:
    - ocr                    # OD完成率
    - mean_return            # 平均回报
    - episode_length         # Episode长度
    - throughput             # 吞吐量
    - avg_speed              # 平均速度
    - conflict_rate          # 冲突率

# ==============================================================================
# Misc Configuration
# ==============================================================================
misc:
  # 随机种子
  seed: 42

  # 线程数
  num_workers: 4

  # PIN内存（用于GPU训练）
  pin_memory: true

  # 混合精度训练
  use_amp: false

  # 检测点
  detect_anomaly: false

# ==============================================================================
# 关键修改总结
# ==============================================================================
# 1. 学习率：1e-4 → 5e-5（降低50%，提高稳定性）
# 2. Entropy系数：0.01 → 0.005（降低50%，减少随机性）
# 3. Bottleneck奖励权重：1.0 → 0.4（降低60%，减少对局部指标的过度优化）
# 4. 训练迭代数：100 → 150（增加50%，给模型更多时间学习）
# 5. Early Stopping：patience=15, min_delta=0.005（更早停止，防止过拟合）
#
# 预期效果：
# - Mean Return: 120 → 150+（提升25%）
# - Entropy: 19 → <8（收敛）
# - Policy Loss: 76-972 → <100（稳定）
# - OCR: 54.39% → 55%+（超越baseline）
# ==============================================================================
