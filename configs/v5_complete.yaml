# v5.0完整架构配置文件
# 包含所有三阶段训练的完整配置

# ============================================
# 全局配置
# ============================================
global:
  seed: 42
  device: cuda
  num_workers: 4
  log_dir: logs/v5_complete
  checkpoint_dir: checkpoints/v5_complete

# ============================================
# SUMO配置
# ============================================
sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

# ============================================
# 环境配置
# ============================================
environment:
  name: CompetitionSumoEnv
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.xml

  # SUMO配置
  step_length: 0.1
  max_steps: 36000  # 3600秒 ÷ 0.1秒/步 = 36000步（官方固定）

  # ICV配置
  icv_config:
    penetration_rate: 0.10  # 10% ICV（比赛时调整为0.25）
    max_vehicles: 600  # 官方固定
    control_interval: 5  # 每5步控制一次

# ============================================
# 策略网络配置（JointICVPolicy）
# ============================================
policy:
  # 观测空间
  obs_dim: 321  # max_vehicles(32) * 9 + global_stats(32) + 1(num)

  # 网络架构
  node_dim: 9
  hidden_dim: 128  # 🔥 从64增加到128，提升模型容量
  num_layers: 3
  dropout: 0.1

  # GNN编码器
  gnn:
    interaction_radius: 0.15  # 归一化距离
    ttc_scale: 10.0  # TTC倒数缩放因子

  # 稀疏门控
  sparse_gate:
    initial_k_ratio: 0.10  # 初始K值比例
    min_k: 5
    max_k_ratio: 0.25  # 最大25%（官方限制）
    gumbel_temperature: 1.0
    adaptive_k: true  # 动态调整K值

  # 层次化池化
  hierarchical_pooling:
    num_lanes: 4  # E1, E2, E3, E5
    num_sections: 5
    use_attention: true

# ============================================
# Stage 1: 世界观察者训练配置
# ============================================
stage1_world_observer:
  enabled: true
  name: "World Observer Training"

  # WorldModel配置
  world_model:
    latent_dim: 64
    num_layers: 2  # GRU层数
    dropout: 0.1

  # 训练参数
  training:
    num_episodes: 50  # 收集50个episode的IDM轨迹
    episode_length: 500

    # 优化器
    optimizer: Adam
    lr: 1.0e-3  # 🔥 从3.0e-4提高到1.0e-3，加速收敛
    weight_decay: 1.0e-5
    grad_clip: 1.0

    # 学习率调度
    lr_schedule:
      enabled: true
      type: CosineAnnealingLR
      T_max: 50  # 从20增加到50，匹配新的epoch数
      eta_min: 1.0e-5

    # 早停
    early_stopping:
      enabled: true
      patience: 10  # 从5增加到10，给予更多收敛时间
      min_delta: 1.0e-4

    # 训练轮数
    num_epochs: 50  # 🔥 从20增加到50，更充分训练
    batch_size: 32

    # 数据增强
    data_augmentation:
      enabled: true
      noise_std: 0.01

    # 损失权重
    loss_weights:
      flow: 1.0
      risk: 0.5

  # 验证
  validation:
    enabled: true
    val_interval: 5  # 每5个epoch验证一次
    val_episodes: 10

  # 检查点
  checkpoint:
    save_interval: 5
    save_best_only: true

  # 日志
  logging:
    tensorboard: true
    log_interval: 100

# ============================================
# Stage 2: 引导探索训练配置
# ============================================
stage2_guided_exploration:
  enabled: true
  name: "Guided Exploration Training"

  # 预训练权重
  resume_from_stage1: true
  stage1_checkpoint: checkpoints/v5_complete/stage1_best.pth

  # WorldModel配置（Stage 1训练好的）
  world_model:
    enabled: true
    freeze: false  # 是否冻结WorldModel参数

  # PPO配置
  ppo:
    # 基础参数
    num_iterations: 100              # 🔥 100个迭代，充分训练
    num_steps_per_iteration: 3600   # 🔥 完整3600秒仿真（36000步），与SUMO配置一致
    batch_size: 256                  # 🔥 22G显存可用256
    num_minibatches: 8               # 🔥 8个minibatch平衡训练速度

    # PPO裁剪参数
    clip_param: 0.2
    clip_range vf_lambda: 0.95

    # GAE参数
    gamma: 0.99
    gae_lambda: 0.95

    # 优化器
    optimizer: Adam
    lr: 1.0e-4  # 🔥 从3.0e-4降到1.0e-4，减少Policy Loss波动
    weight_decay: 1.0e-5
    grad_clip: 0.5

    # 学习率调度
    lr_schedule:
      enabled: true
      type: LinearLR
      total_iters: 100              # 🔥 匹配num_iterations
      start_factor: 0.1
      end_factor: 1.0

    # PPO更新参数
    update_epochs: 10
    entropy_coef: 0.02  # 🔥 从0.01增加到0.02，鼓励更多探索
    vf_coef: 0.5

    # KL散度自适应
    target_kl: 0.01

  # 奖励配置（固定权重）
  rewards:
    type: ocr  # 使用OCR奖励
    weights:
      efficiency: 0.5
      stability: 0.3
      cost: 0.2

  # 检查点
  checkpoint:
    save_interval: 100
    save_best_only: true

  # 日志
  logging:
    tensorboard: true
    wandb: false
    log_interval: 10

# ============================================
# Stage 3: 约束优化训练配置
# ============================================
stage3_constrained_optimization:
  enabled: true
  name: "Constrained Optimization Training"

  # 预训练权重
  resume_from_stage2: true
  stage2_checkpoint: checkpoints/v5_complete/stage2_best.pth

  # CostCritic配置
  cost_critic:
    enabled: true
    hidden_dim: 128
    dropout: 0.1

  # 拉格朗日优化器配置
  lagrangian:
    initial_lambda: 0.1
    lambda_lr: 0.01
    cost_threshold: 0.5  # 成本阈值
    adaptive_lambda: true

  # DynamicWeightGate配置
  dynamic_gate:
    enabled: true
    global_dim: 64
    hidden_dim: 32
    adaptive: true
    temperature: 1.0
    smoothing_coef: 0.9

  # PPO配置（扩展）
  ppo:
    # 继承Stage 2的所有PPO参数
    inherit_from: stage2_guided_exploration

    # 约束优化扩展参数
    use_cost_critic: true
    use_dynamic_gate: true

    # 损失权重
    loss_weights:
      policy: 1.0
      value: 0.5
      cost: 0.5
      entropy: 0.01

    # 拉格朗日损失
    lagrangian_loss:
      enabled: true
      lambda_lr: 0.01

  # 奖励配置（动态权重）
  rewards:
    type: ocr
    use_dynamic_weights: true  # 使用DynamicWeightGate

  # 检查点
  checkpoint:
    save_interval: 50
    save_best_only: true

  # 日志
  logging:
    tensorboard: true
    wandb: true
    project: traffic_icv_v5
    log_interval: 10

# ============================================
# SafetyShield配置
# ============================================
safety_shield:
  # Level 1: 物理限制裁剪
  physical_limits:
    min_accel: -4.5  # m/s²
    max_accel: 2.0    # m/s²
    emergency_decel: -4.5  # m/s²

  # Level 2: TTC检查
  ttc_check:
    enabled: true
    ttc_threshold: 2.0  # 秒
    min_distance: 2.0    # 米
    reaction_time: 0.5   # 秒

  # 奖励
  safety_reward: 0.1
  violation_penalty: -1.0

  # 执行模式
  execution_mode: inference_only  # 只在推理时启用

# ============================================
# 评估配置
# ============================================
evaluation:
  enabled: true

  # 评估频率
  eval_interval: 100  # 每100次迭代评估一次

  # 评估环境数
  num_eval_episodes: 20
  num_eval_envs: 4

  # 评估指标
  metrics:
    - ocr  # OD完成率
    - intervention_cost  # 干预成本
    - final_score  # 最终得分
    - safety_metrics  # 安全指标

  # 保存最佳模型
  save_best_model: true
  metric_to_optimize: final_score  # 优化最终得分
  mode: max  # 越大越好

# ============================================
# 实验配置
# ============================================
experiment:
  name: v5_complete_architecture
  description: "完整v5.0架构实现，包含所有组件"

  # 标签
  tags:
    - v5.0
    - complete_architecture
    - three_stage_training

  # 注释
  notes: |
    完整v5.0架构实现，包含：
    - HierarchicalPooling（层次化聚合）
    - WorldModel（世界模型-RSSM）
    - CostCritic（成本约束优化）
    - DynamicWeightGate（动态权重门控）
    - SafetyShield（双层安全屏障）

    三阶段训练：
    1. Stage 1: 世界观察者（监督学习）
    2. Stage 2: 引导探索（PPO，固定权重）
    3. Stage 3: 约束优化（拉格朗日松弛）

# ============================================
# 调试配置
# ============================================
debug:
  enabled: false

  # 检测NaN
  detect_nan: true

  # 检测梯度爆炸
  detect_anomaly: false

  # 梯度检查
  gradient_checking:
    enabled: false
    eps: 1.0e-6

  # 性能分析
  profile:
    enabled: false
    use_cuda_profiler: false

# ============================================
# 杂项配置
# ============================================
misc:
  # 随机种子
  seed: 42

  # 设备配置
  device: cuda
  num_gpus: 1

  # 混合精度训练
  amp:
    enabled: true
    opt_level: O1

  # 梯度累积
  gradient_accumulation:
    enabled: false
    accumulation_steps: 4

  # 多环境并行
  parallel_envs:
    enabled: true
    num_envs: 8
    async_env: true
