# TJ_transport_v4 - 快速测试配置
# 用于验证训练流程是否正常工作
# 注意：神经网络配置与标准配置完全相同，只减少数据量和训练轮数

# 基础设置
device: cuda  # cuda, cpu, auto
seed: 42
precision: bf16  # bf16, fp16, fp32

# 项目路径
paths:
  root_dir: .
  data_dir: data
  log_dir: logs
  checkpoint_dir: checkpoints
  result_dir: results

# SUMO环境配置
environment:
  sumo_cfg: 仿真环境_初赛_1.0\仿真环境-初赛\sumo.sumocfg
  net_file: 仿真环境_初赛_1.0\仿真环境-初赛\net.xml
  route_file: 仿真环境_初赛_1.0\仿真环境-初赛\routes.xml
  step_length: 0.1
  max_steps: 300  # 快速测试：每个episode最多300步（标准3600）
  control_ratio: 0.25
  use_gui: false
  num_parallel_workers: 2  # 减少并行数（标准4）

# 模型架构 - 与标准配置完全相同
model:
  # 图神经网络
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  # 世界模型
  world_model:
    input_dim: 256
    hidden_dim: 128
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  # 控制器
  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 16
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  # 安全屏障
  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  # 图构建
  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# 训练配置 - 快速测试（只减少数据和轮数，神经网络配置不变）
training:
  # 阶段1: World Model预训练
  phase1:
    enabled: true
    num_episodes: 2   # 快速测试：2 episodes（标准20）
    epochs: 3         # 快速测试：3 epochs（标准20）
    batch_size: 128   # 保持标准配置
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    data_collection_timeout: 120  # 2分钟超时
    num_parallel_workers: 2  # 减少并行（标准4）
    use_mixed_precision: false
    gradient_clip: 1.0
    warmup_epochs: 1
    phase1_model_path: "checkpoints/world_model_phase1.pth"

  # 阶段2: PPO训练
  phase2:
    enabled: true
    num_envs: 2       # 快速测试：2环境（标准4）
    total_timesteps: 1000  # 快速测试：1000步（标准100000）
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 10
    batch_size: 128  # 保持标准配置
    n_steps: 2048    # 保持标准配置
    phase2_model_path: "checkpoints/ppo_phase2.pth"

  # 阶段3: 端到端微调
  phase3:
    enabled: true
    total_timesteps: 500  # 快速测试：500步（标准50000）
    learning_rate: 1.0e-5
    freeze_bn: true
    phase3_model_path: "checkpoints/e2e_phase3.pth"

  # 阶段4: 约束优化训练
  phase4:
    enabled: true
    total_timesteps: 500  # 快速测试：500步（标准50000）
    cost_limit: 0.1
    learning_rate: 1.0e-4
    final_model_path: "checkpoints/final_model.pth"

# 评估配置
evaluation:
  num_episodes: 2  # 快速测试：2 episodes（标准5）
  generate_xlsx: false  # 不生成XLSX以加快速度

# WandB配置
wandb:
  enabled: false
  project: tj-transport-test
  entity: null
  run_name: null

# 日志配置
logging:
  log_every_n_steps: 10
  val_check_interval: 100
  save_top_k: 1
  profiler: null

