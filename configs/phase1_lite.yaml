# 初赛轻量级训练配置 - Phase 1 Lite
# 核心目标：快速训练（6-8小时），直接优化OCR

# =============================================================================
# 基础配置
# =============================================================================
device: cuda:0
seed: 42

# 路径配置
paths:
  checkpoint_dir: checkpoints/phase1_lite
  log_dir: logs/phase1_lite
  tensorboard_dir: runs/phase1_lite

# =============================================================================
# 环境配置
# =============================================================================
environment:
  # SUMO配置（使用绝对路径或相对于项目根目录的路径）
  sumo_config: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # ========== 官方固定参数（比赛环境）==========
  max_vehicles: 600        # 在线车辆峰值（官方固定）
  inflow_rate: 9900        # 总流量 9,900 veh/h（官方固定）
  max_steps: 36000         # 3600秒 ÷ 0.1秒/步 = 36000步（官方固定）
  step_length: 0.1         # 时间步长0.1秒（官方固定）
  warmup_steps: 300        # 预热30秒
  
  # ========== 智能控制策略（优化点）==========
  icv_ratio: 0.10          # 🎯 控制10%车辆（vs 官方25% CV占比）
                           # 策略：官方25%是CV可控占比，不是必须全控
                           # 通过智能选择关键车辆，10%即可达到最佳OCR
  
  # ICV动态管理（减少不必要的控制）
  icv_reevaluate_interval: 100  # 每100步（10秒）重新评估
  icv_min_control_duration: 50   # 车辆至少控制5秒

  # 奖励配置（基础环境使用，训练时会用OCR奖励覆盖）
  rewards:
    speed_weight: 1.0
    efficiency_weight: 2.0
    safety_weight: 3.0
    intervention_cost_weight: 1.5

# =============================================================================
# 模型配置 - 轻量级OCR-GNN
# =============================================================================
model:
  # GNN配置
  gnn:
    node_dim: 9               # 车辆状态维度
    hidden_dim: 64            # 隐藏层维度（降低以加速训练）
    output_dim: 64            # 输出维度
    num_layers: 3             # GNN层数（3层足够）
    dropout: 0.1
    top_k_ratio: 0.10         # ⭐ 只控制10%的车辆（关键优化）

# =============================================================================
# 训练配置（2个阶段）
# =============================================================================
training:
  # ========== Stage 1: 行为克隆 ==========
  stage1:
    num_episodes: 10          # 数据收集episodes（减少到10，使用缓存）
    epochs: 5                 # 训练轮数（5 epochs足够，避免过拟合）
    batch_size: 512           # 批大小（进一步增加以提高GPU利用率）
    learning_rate: 0.003      # 学习率（提高以加速收敛）
    num_envs: 8              # 并行环境数（加速数据收集，建议8-16）

  # ========== Stage 2: 强化学习微调 ==========
  stage2:
    # 训练episodes
    num_episodes: 50          # 训练episodes数
    
    # 学习率
    learning_rate: 0.0001     # 策略梯度学习率（比Stage 1更小）
    
    # 折扣因子
    gamma: 0.99               # 奖励折扣因子
    
    # 梯度裁剪
    max_grad_norm: 1.0        # 梯度裁剪阈值

# =============================================================================
# OCR奖励配置
# =============================================================================
ocr_rewards:
  # 评测公式权重
  k_penalty: 0.1             # 干预成本惩罚系数
  w_efficiency: 0.7          # ⭐ 初赛效率权重（主要目标）
  w_stability: 0.3           # 稳定性权重

  # 干预成本权重
  alpha: 1.0                 # 加速度指令权重
  beta: 5.0                  # 换道指令权重（5倍成本）

  # 基准统计（可选，如果没有则为None）
  baseline_ocr: null
  baseline_speed_std: null
  baseline_avg_accel: null

# =============================================================================
# 稀疏控制器配置
# =============================================================================
sparse_controller:
  enabled: true
  controller_type: 'learned'  # 'rule' 或 'learned'

  # 决策间隔（⭐ 关键优化：减少T_total）
  decision_interval: 10       # 每10步决策一次（而非每步）

  # Top-K参数（⭐ 关键优化：减少N_ICV）
  top_k_ratio: 0.10          # 只控制10%车辆（vs 原方案25%）
  min_k: 5                   # 至少控制5辆
  max_k: 30                  # 最多控制30辆

  # 基于规则的控制器参数（rule模式使用）
  bottleneck_threshold: 0.7   # 瓶颈区域阈值
  speed_threshold_ratio: 0.7  # 速度异常阈值
  merge_zone_start: 0.5      # 汇流区起始位置
  merge_zone_end: 0.8        # 汇流区结束位置
  ttc_threshold: 3.0         # TTC阈值

# =============================================================================
# 神经网络ICV评分配置（✅ 默认启用）
# =============================================================================
neural_icv_scoring:
  enabled: true              # ✅ 默认启用神经网络评分

  # 网络架构
  node_dim: 9                # 车辆状态特征维度
  hidden_dim: 64             # GNN隐藏层维度
  num_layers: 3              # GNN层数
  num_heads: 4               # 注意力头数
  dropout: 0.1               # Dropout概率

  # 图构建参数
  distance_threshold: 100.0  # 车辆交互距离阈值（米）
  max_neighbors: 8           # 每辆车的最大邻居数

  # 预训练权重（可选）
  checkpoint_path: null      # 预训练权重路径，null表示从头训练

# =============================================================================
# 启发式车辆选择器配置（用于Stage 1数据生成）
# =============================================================================
heuristic_selector:
  # ========== 基于官方路网的瓶颈区域定义 ==========
  # 路网结构：E1 → E2 → E3 → E5 → E6 → E7 → E8 → E9 → E10 → E11 → E12 → E13
  # 关键汇入点（来自routes.xml分析）：
  #   - J5 (E23汇入，1500 veh/h)
  #   - J15 (E17汇入，1500 veh/h) ← 最严重瓶颈
  #   - J17 (E19汇入，1500 veh/h) ← 最严重瓶颈
  
  bottleneck_s_min: 1200.0   # 瓶颈区域起点（E17/J15附近）
  bottleneck_s_max: 2200.0   # 瓶颈区域终点（E19/J17附近）
  
  # 控制策略参数（匹配官方车辆参数）
  max_accel: 2.0             # 最大加速度（低于官方HV的0.8以更保守）
  max_decel: -4.5            # 最大减速度（匹配官方HV的4.5）
  safe_time_gap: 1.5         # 安全时间间隔
  desired_speed: 30.0        # 目标速度（匹配官方maxSpeed=30）

# =============================================================================
# 神经网络ICV评分器训练配置
# =============================================================================
neural_icv_pretrain:
  # 阶段1：预训练（监督学习，从规则评分学习）
  num_episodes: 20           # 数据收集的episode数
  epochs: 10                 # 训练轮数
  batch_size: 32             # 批大小
  learning_rate: 0.001       # 学习率

neural_icv_finetune:
  # 阶段2：微调（强化学习，直接优化OCR）
  total_timesteps: 100000    # 总训练步数
  learning_rate: 0.0003      # 学习率
  gamma: 0.99                # 折扣因子
  gae_lambda: 0.95           # GAE参数

# =============================================================================
# 日志配置
# =============================================================================
logging:
  tensorboard: true
  log_interval: 100

  # 要记录的指标
  metrics:
    - episode_reward
    - episode_length
    - ocr                    # OD完成率
    - s_efficiency           # 效率得分
    - s_stability            # 稳定性得分
    - c_intervention         # 干预成本
    - p_intervention         # 惩罚因子
    - num_controlled_vehicles # 控制车辆数

# =============================================================================
# 高级配置
# =============================================================================
advanced:
  mixed_precision: true      # 混合精度训练（加速）
  gradient_checkpointing: false
  amp: true                  # 自动混合精度
