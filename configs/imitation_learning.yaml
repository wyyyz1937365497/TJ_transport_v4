# ==============================================================================
# Imitation Learning Configuration for OCR-MAX
# ==============================================================================
# This configuration file is for training a policy network through behavioral
# cloning, using expert demonstrations from rule-based policies.
#
# Training Pipeline:
# 1. Collect expert demonstrations (scripts/collect_expert_demonstrations.py)
# 2. Train policy through behavioral cloning (this script)
# 3. Evaluate and submit to competition
#
# Expected Performance:
# - OCR: 55-57% (above baseline of 54.69%)
# - Training time: 4-6 hours (50 epochs)
# - Convergence: Stable (monotonically decreasing MSE loss)
# ==============================================================================

global:
  seed: 42
  device: cuda

# ==============================================================================
# Data Configuration
# ==============================================================================
data:
  # Path to expert demonstrations (generated by collect_expert_demonstrations.py)
  demo_data_path: data/demonstrations/expert/demonstrations.pkl

  # Number of demonstration episodes
  num_demos: 100

  # Train/validation split
  val_split: 0.2  # 20% for validation

  # DataLoader parameters
  batch_size: 32
  num_workers: 4
  pin_memory: true
  drop_last: true  # Drop last incomplete batch

# ==============================================================================
# Policy Network Configuration
# ==============================================================================
# Reuses SimplifiedICVPolicy from the PPO implementation
# Architecture: Multi-View Graph Attention + GNN
policy:
  # Observation dimension = max_vehicles * node_dim + global_stats + num_vehicles
  #                     = 32 * 9 + 32 + 1 = 321
  obs_dim: 321

  # Vehicle state dimension (s, d, vs, vd, speed, accel, lane, angle, is_icv)
  node_dim: 9

  # Hidden layer dimension
  hidden_dim: 128

  # Number of GNN layers
  num_layers: 3

  # Maximum number of vehicles to process
  num_vehicles: 32

# ==============================================================================
# Training Configuration
# ==============================================================================
training:
  # Number of training epochs
  num_epochs: 50

  # Learning rate
  lr: 1.0e-3

  # L2 regularization (weight decay)
  weight_decay: 1.0e-5

  # Gradient clipping (max norm)
  grad_clip: 1.0

  # Learning rate scheduler
  lr_scheduler:
    type: ReduceLROnPlateau  # Reduce LR when validation loss plateaus
    patience: 5              # Number of epochs with no improvement
    factor: 0.5              # Factor to reduce LR (new_lr = lr * factor)
    min_lr: 1.0e-6           # Minimum learning rate

  # Optimizer settings
  optimizer:
    type: adam
    betas: [0.9, 0.999]
    eps: 1.0e-8

# ==============================================================================
# Evaluation Configuration
# ==============================================================================
evaluation:
  # Validation frequency (every N epochs)
  eval_interval: 1

  # Number of episodes for final evaluation
  num_eval_episodes: 10

  # Early stopping (prevents overfitting)
  early_stopping:
    enabled: true
    patience: 10              # Stop after N epochs without improvement
    min_delta: 0.001          # Minimum change to qualify as improvement
    monitor: val_loss         # Metric to monitor

  # Evaluation metrics
  metrics:
    - mse_loss               # Mean squared error loss
    - mae_loss               # Mean absolute error loss
    - action_accuracy        # Action prediction accuracy (within threshold)

# ==============================================================================
# Checkpoint Configuration
# ==============================================================================
checkpoints:
  # Directory to save checkpoints
  save_dir: checkpoints/imitation_learning

  # Save frequency (every N epochs)
  save_interval: 10

  # Keep best model only (based on validation loss)
  keep_best_only: false

  # Keep last N checkpoints
  keep_last_n: 3

# ==============================================================================
# Logging Configuration
# ==============================================================================
logging:
  # Log directory
  log_dir: logs/imitation_learning

  # TensorBoard logging
  use_tensorboard: true

  # Log frequency (every N batches)
  log_interval: 10

  # Print training progress
  verbose: true

# ==============================================================================
# Environment Configuration (for evaluation)
# ==============================================================================
# These settings are used when evaluating the trained policy
environment:
  # SUMO configuration file
  sumocfg_file: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg

  # Maximum steps per episode
  max_steps: 3600

  # ICV ratio (percentage of vehicles to control)
  icv_ratio: 0.10  # 10%

  # Use GUI (for debugging)
  use_gui: false

# ==============================================================================
# Heuristic Selector (for vehicle selection during evaluation)
# ==============================================================================
heuristic_selector:
  # Bottleneck region (s coordinates in meters)
  bottleneck_s_min: 1200.0
  bottleneck_s_max: 2200.0

  # Key merge points
  key_merge_points:
    - {s: 1400.0, weight: 1.5, name: 'E17/J15'}
    - {s: 1800.0, weight: 1.5, name: 'E19/J17'}
    - {s: 1000.0, weight: 1.2, name: 'E23/J5'}

  # Scoring weights
  weights:
    bottleneck: 0.40
    speed: 0.25
    lane: 0.15
    distance: 0.15
    ttc: 0.05

  # Vehicle parameters
  desired_speed: 30.0
  max_accel: 2.0
  max_decel: -4.5
  safe_time_gap: 1.5
  speed_threshold_ratio: 0.7

# ==============================================================================
# Data Augmentation (Optional)
# ==============================================================================
# Data augmentation can improve generalization but is not required
data_augmentation:
  enabled: false

  # Add Gaussian noise to observations
  obs_noise:
    enabled: false
    std: 0.01

  # Add noise to actions
  action_noise:
    enabled: false
    std: 0.05

# ==============================================================================
# Advanced Settings
# ==============================================================================
# Loss function options
loss:
  # Primary loss: MSE (Mean Squared Error)
  type: mse

  # Alternative: Smooth L1 Loss (less sensitive to outliers)
  # type: smooth_l1
  # beta: 1.0

  # Masking: Only compute loss for controlled vehicles
  use_masking: true

# Training tricks
training_tricks:
  # Mixup (mix observations from different transitions)
  mixup:
    enabled: false
    alpha: 0.2

  # Label smoothing (smooth action targets)
  label_smoothing:
    enabled: false
    epsilon: 0.1

# ==============================================================================
# Notes
# ==============================================================================
# Training Procedure:
#
# 1. Collect demonstrations:
#    python scripts/collect_expert_demonstrations.py \
#        --config configs/imitation_learning.yaml \
#        --num_episodes 100 \
#        --num_workers 8 \
#        --output_dir data/demonstrations/expert
#
# 2. Train policy:
#    python scripts/train_imitation_learning.py \
#        --config configs/imitation_learning.yaml \
#        --demo_data data/demonstrations/expert/demonstrations.pkl \
#        --output_dir checkpoints/imitation_learning \
#        --log_dir logs/imitation_learning
#
# 3. Evaluate:
#    python scripts/evaluate_imitation.py \
#        --checkpoint checkpoints/imitation_learning/best.pth \
#        --num_episodes 5 \
#        --baseline_ocr 0.5469
#
# 4. Update submission script:
#    Edit submit_solution.py to load the trained checkpoint
#
# Expected Results:
# - Training loss: Should decrease monotonically
# - Validation loss: Should decrease and plateau
# - Convergence: Typically 20-40 epochs
# - OCR: 55-57% (above baseline of 54.69%)
# ==============================================================================
