# ICV评分器训练配置
# 两阶段训练：行为克隆（监督学习） + PPO微调

# =============================================================================
# 基础配置
# =============================================================================
device: cuda:0
seed: 42

# 路径配置
paths:
  checkpoint_dir: checkpoints/icv_scorer
  log_dir: logs/icv_scorer
  tensorboard_dir: runs/icv_scorer

# =============================================================================
# 环境配置
# =============================================================================
environment:
  # SUMO配置
  sumo_config: 仿真环境_初赛_1.0/仿真环境-初赛/sumo_train.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml

  # 官方固定参数
  max_vehicles: 600
  inflow_rate: 9900
  max_steps: 36000
  step_length: 0.1
  warmup_steps: 300

  # ICV配置
  icv_ratio: 0.10  # 控制车辆比例
  icv_reevaluate_interval: 100
  icv_min_control_duration: 50

# =============================================================================
# 神经网络配置
# =============================================================================
neural_icv_scoring:
  enabled: true

  # 网络架构
  node_dim: 9              # 车辆状态特征维度 [s, d, vs, vd, speed, accel, lane, angle, in_bottleneck]
  hidden_dim: 64           # GNN隐藏层维度
  num_layers: 3            # GNN层数
  dropout: 0.1             # Dropout概率

  # 图构建参数
  interaction_radius: 0.15 # 车辆交互半径（归一化距离）

  # 预训练权重
  checkpoint_path: null    # null表示从头训练

  # 回退机制
  fallback_on_error: true  # 神经网络失败时回退到规则评分

# =============================================================================
# Stage 1: 行为克隆训练（监督学习）
# =============================================================================
stage1_behavior_cloning:
  # 数据收集
  num_episodes: 20         # 数据收集的episode数
  num_envs: 8              # 并行环境数（加速数据收集）
  collect_steps: 500       # 每个episode收集的步数

  # 训练参数
  epochs: 10               # 训练轮数
  batch_size: 32           # 批大小
  learning_rate: 0.001     # 学习率
  weight_decay: 1e-5       # 权重衰减（L2正则化）

  # 优化器
  optimizer: adam
  betas: [0.9, 0.999]

  # 学习率调度
  lr_scheduler: reduce_on_plateau  # 'reduce_on_plateau' 或 'cosine'
  lr_scheduler_patience: 2         # ReduceLROnPlateau的patience
  lr_scheduler_factor: 0.5         # 学习率衰减因子

  # 数据增强
  use_data_augmentation: true
  noise_std: 0.01            # 添加噪声的标准差

  # 早停
  early_stopping: true
  early_stopping_patience: 5
  early_stopping_min_delta: 1e-4

# =============================================================================
# Stage 2: PPO微调（强化学习）
# =============================================================================
stage2_ppo:
  # 训练参数
  total_timesteps: 100000   # 总训练步数
  num_envs: 8               # 并行环境数

  # PPO参数
  learning_rate: 0.0003     # 策略梯度学习率
  gamma: 0.99               # 奖励折扣因子
  gae_lambda: 0.95          # GAE参数
  clip_range: 0.2           # PPO裁剪范围
  clip_range_vf: 0.2        # 价值函数裁剪范围

  # 批量处理
  n_steps: 2048             # 每次更新的步数
  batch_size: 64            # PPO批大小
  n_epochs: 10              # 每次更新的epochs

  # 梯度处理
  max_grad_norm: 0.5        # 梯度裁剪阈值
  normalize_advantage: true # 归一化优势

  # 价值函数
  vf_coef: 0.5              # 价值函数损失权重
  ent_coef: 0.01            # 熵正则化系数

  # 学习率调度
  lr_scheduler: linear      # 'linear' 或 'constant'

  # 检查点
  save_freq: 10000          # 每10000步保存一次
  eval_freq: 5000           # 每5000步评估一次

# =============================================================================
# 奖励配置
# =============================================================================
ocr_rewards:
  # 评测公式权重
  k_penalty: 0.1             # 干预成本惩罚系数
  w_efficiency: 0.7          # 效率权重
  w_stability: 0.3           # 稳定性权重

  # 干预成本权重
  alpha: 1.0                 # 加速度指令权重
  beta: 5.0                  # 换道指令权重（5倍成本）

  # 基准统计（可选）
  baseline_ocr: null
  baseline_speed_std: null
  baseline_avg_accel: null

# =============================================================================
# 启发式规则配置（用于Stage 1数据生成）
# =============================================================================
heuristic_selector:
  # 瓶颈区域定义（根据实际路网调整）
  # 路网：E1 → E2 → E3 → E5 → E6 → E7 → E8 → E9 → E10 → E11 → E12 → E13
  # 关键汇入点：
  #   - J5 (E23汇入，1500 veh/h)
  #   - J15 (E17汇入，1500 veh/h) ← 最严重瓶颈
  #   - J17 (E19汇入，1500 veh/h) ← 最严重瓶颈

  bottleneck_s_min: 1200.0   # 瓶颈区域起点（E17/J15附近）
  bottleneck_s_max: 2200.0   # 瓶颈区域终点（E19/J17附近）

  # 控制策略参数
  max_accel: 2.0             # 最大加速度
  max_decel: -4.5            # 最大减速度
  safe_time_gap: 1.5         # 安全时间间隔
  desired_speed: 30.0        # 目标速度

# =============================================================================
# 稀疏控制器配置
# =============================================================================
sparse_controller:
  enabled: true
  controller_type: 'rule'

  # 决策间隔
  decision_interval: 10

  # Top-K参数
  top_k_ratio: 0.10
  min_k: 5
  max_k: 30

  # 规则控制器参数
  bottleneck_threshold: 0.7
  speed_threshold_ratio: 0.7
  merge_zone_start: 0.5
  merge_zone_end: 0.8
  ttc_threshold: 3.0

# =============================================================================
# 训练优化配置
# =============================================================================
training:
  # 混合精度训练
  mixed_precision: true
  amp: true

  # 梯度累积
  gradient_accumulation_steps: 1

  # 梯度检查点（节省内存）
  gradient_checkpointing: false

  # 数值稳定性
  epsilon: 1e-8

# =============================================================================
# 日志配置
# =============================================================================
logging:
  tensorboard: true
  log_interval: 100
  verbose: true

  # 要记录的指标
  metrics:
    # Stage 1指标
    - epoch
    - train_loss
    - val_loss
    - learning_rate
    - mse_loss
    - correlation

    # Stage 2指标
    - episode_reward
    - episode_length
    - ocr
    - s_efficiency
    - s_stability
    - c_intervention
    - p_intervention
    - num_controlled_vehicles
    - policy_loss
    - value_loss
    - entropy

  # 模型评估
  eval_episodes: 10         # 评估时的episodes数

# =============================================================================
# 高级配置
# =============================================================================
advanced:
  # 随机种子
  torch_deterministic: false
  cuda_deterministic: false

  # 性能优化
  pin_memory: true          # DataLoader pin_memory
  persistent_workers: true   # DataLoader persistent_workers
  num_workers: 4             # DataLoader workers

  # 调试
  debug: false
  profile: false             # 性能分析

# =============================================================================
# 检查点配置
# =============================================================================
checkpoint:
  # 自动保存
  auto_save: true
  save_best_only: true       # 只保存最佳模型
  save_optimizer: true       # 保存优化器状态

  # 恢复训练
  resume_from: null          # 从检查点恢复训练

  # 模型选择
  metric: ocr                # 用于选择最佳模型的指标
  mode: max                  # 'max' 或 'min'
