# 初赛优化配置 - 高性能版本（针对Phase 2优化）
# 优化目标：最大化GPU和CPU利用率，加速训练

# =============================================================================
# 基础设置
# =============================================================================
device: cuda  # cuda, cpu, auto
seed: 42
precision: bf16  # bf16, fp16, fp32

# =============================================================================
# 项目路径配置
# =============================================================================
paths:
  root_dir: .
  data_dir: data
  log_dir: logs/competition
  checkpoint_dir: checkpoints/competition
  result_dir: results/competition

# =============================================================================
# SUMO环境配置 - 性能优化
# =============================================================================
environment:
  sumo_cfg: 仿真环境_初赛_1.0/仿真环境-初赛/sumo.sumocfg
  net_file: 仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: 仿真环境_初赛_1.0/仿真环境-初赛/routes.xml

  # ⚡ 性能优化：减少episode长度
  step_length: 0.1
  max_steps: 1800   # 从3600减少到1800（30分钟仿真），加速3倍

  control_ratio: 0.25
  use_gui: false

  # ⚡ 性能优化：大幅增加并行环境数量
  num_parallel_workers: 16  # 从8增加到16

  # 环境约束
  max_vehicles: 32    # 最大车辆数
  port: 8813          # SUMO默认端口

# =============================================================================
# 模型架构
# =============================================================================
model:
  # 基础模型配置
  state_dim: 9       # 车辆状态维度
  history_dim: 32    # 历史特征维度

  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  world_model:
    input_dim: 256
    hidden_dim: 128
    latent_dim: 64
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 32
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# =============================================================================
# 训练配置 - Phase 2性能优化
# =============================================================================
training:
  phase1:
    enabled: true
    num_episodes: 50
    epochs: 30
    batch_size: 256
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    data_collection_timeout: 300
    num_parallel_workers: 16  # ⚡ 增加到16
    use_mixed_precision: true
    gradient_clip: 1.0
    warmup_epochs: 5
    phase1_model_path: "checkpoints/competition/v4_phase1/world_model_final.pth"

  # ⚡ Phase 2性能优化
  phase2:
    enabled: true
    num_envs: 16        # ⚡ 从8增加到16 - 关键优化！
    total_timesteps: 200000
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 10
    batch_size: 512    # ⚡ 从256增加到512 - 更大的batch
    n_steps: 2048      # ⚡ 从4096减少到2048 - 更频繁更新
    phase2_model_path: "checkpoints/competition/v4_phase2/shielded_ppo.zip"

  phase3:
    enabled: true
    total_timesteps: 100000
    learning_rate: 1.0e-5
    freeze_bn: true
    phase3_model_path: "checkpoints/competition/e2e_phase3.pth"

  phase4:
    enabled: true
    total_timesteps: 100000
    cost_limit: 0.1
    learning_rate: 1.0e-4
    lagrangian_multiplier_init: 0.1
    final_model_path: "checkpoints/competition/final_model_competition.pth"

# =============================================================================
# 评估配置
# =============================================================================
evaluation:
  num_episodes: 10
  generate_xlsx: true
  save_detailed_logs: true

# =============================================================================
# 可视化与监控
# =============================================================================
wandb:
  enabled: true
  project: tj-transport-competition
  entity: null
  run_name: preliminary_optimized

logging:
  log_every_n_steps: 10
  val_check_interval: 100
  save_top_k: 5
  profiler: null

# =============================================================================
# 比赛特定优化
# =============================================================================
competition:
  use_accurate_frenet: true
  enable_prediction_loop: true

  # 奖励权重配置
  reward_weights:
    speed_norm: 0.0333       # 速度归一化因子 (1/30)
    throughput: 10.0         # 吞吐量权重

  # 效率得分权重
  efficiency_weights: [5.0, 3.0, 2.0]  # [平峰, 早高峰, 晚高峰]

  # 稳定性权重
  stability_weight: 0.5      # 稳定性权重

  # 拥堵惩罚权重
  congestion_penalty_weight: 2.0

  # 停车惩罚权重
  stopped_penalty_weight: 1.0

  prediction_weights:
    risk_vehicle_boost: 1.3
    recommended_vehicle_boost: 1.2
    congestion_threshold: 0.7
    feature_enhancement_risk: 0.2
    feature_enhancement_congestion: 0.1

  bottleneck_optimization:
    enabled: true
    junctions: ["J14", "J15", "J17"]
    priority_multiplier: 1.5

  intervention_cost:
    alpha: 1.0
    beta: 5.0
    cost_penalty_factor: 0.01

# =============================================================================
# 训练优化技巧
# =============================================================================
training_tricks:
  use_lr_scheduler: true
  lr_scheduler:
    type: cosine
    warmup_steps: 1000
    min_lr: 1.0e-6

  use_gradient_clip: true
  max_grad_norm: 1.0

  use_experience_replay: false

  curriculum_learning:
    enabled: false
    stages: []
