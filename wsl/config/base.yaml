# TJ_transport_v4 - WSL优化版本配置文件

# 基础设置
device: cuda  # cuda, cpu, mps
seed: 42
precision: bf16  # bf16, fp16, fp32

# 项目路径
paths:
  root_dir: .
  data_dir: data
  log_dir: logs
  checkpoint_dir: checkpoints
  result_dir: results

# SUMO环境配置
environment:
  sumo_cfg: ../仿真环境_初赛_1.0/仿真环境-初赛/sumo.sumocfg
  net_file: ../仿真环境_初赛_1.0/仿真环境-初赛/net.xml
  route_file: ../仿真环境_初赛_1.0/仿真环境-初赛/routes.xml
  step_length: 0.1
  max_steps: 3600
  control_ratio: 0.25
  use_gui: false
  num_parallel_workers: 4

# 模型架构
model:
  # 图神经网络
  gnn:
    node_dim: 9
    edge_dim: 4
    hidden_dim: 64
    output_dim: 256
    num_layers: 3
    heads: 4
    dropout: 0.1
    use_batch_norm: true

  # 世界模型
  world_model:
    input_dim: 256
    hidden_dim: 128
    future_steps: 5
    num_layers: 2
    bidirectional: false
    dropout: 0.1

  # 控制器
  controller:
    gnn_dim: 256
    world_dim: 256
    global_dim: 16
    hidden_dim: 128
    action_dim: 2
    top_k: 5
    dropout: 0.2

  # 安全屏障
  safety:
    ttc_threshold: 2.0
    thw_threshold: 1.5
    max_accel: 2.0
    max_decel: -3.0
    emergency_decel: -5.0

  # 图构建
  graph:
    interaction_radius: 100.0
    max_neighbors: 8
    lane_change_distance: 50.0

# 训练配置
training:
  # 阶段1: 世界模型预训练
  phase1:
    enabled: true
    num_episodes: 5
    epochs: 10
    batch_size: 256
    learning_rate: 1.0e-4
    weight_decay: 1.0e-5
    warmup_epochs: 2
    gradient_clip: 1.0
    num_workers: 4
    prefetch_factor: 2
    data_collection_timeout: 180
    use_amp: true

  # 阶段2: PPO训练
  phase2:
    enabled: true
    num_envs: 1
    total_timesteps: 2000
    learning_rate: 3.0e-4
    gamma: 0.99
    gae_lambda: 0.95
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_loss_coef: 0.5
    update_epochs: 4
    batch_size: 64

  # 阶段3: 端到端微调
  phase3:
    enabled: true
    total_timesteps: 30000
    learning_rate: 1.0e-5
    freeze_bn: true

  # 阶段4: 约束优化
  phase4:
    enabled: true
    total_timesteps: 20000
    cost_limit: 0.1
    learning_rate: 1.0e-4
    lambda_lr: 0.01

# 评估配置
evaluation:
  num_episodes: 5
  generate_xlsx: true

# WandB配置
wandb:
  enabled: false
  project: tj-transport
  entity: null
  run_name: null

# 日志配置
logging:
  log_every_n_steps: 10
  val_check_interval: 100
  save_top_k: 3
  profiler: simple  # simple, advanced, null
